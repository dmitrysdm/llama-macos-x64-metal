name: Build llama.cpp for Intel x86_64 + AMD GPU (macOS 15)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows single-click manual run without asking for inputs

jobs:
  build-intel-amd:
    # Explicitly use macOS 15 on Intel x86_64 runners
    runs-on: macos-15-intel

    steps:
      - name: Fetch Latest Official llama.cpp Tag
        id: fetch_tag
        run: |
          # Fetch the latest release tag name directly from the official upstream repository API
          LATEST_TAG=$(curl -s https://github.com | jq -r .tag_name)
          
          # Fallback mechanism if the release API is rate-limited or fails
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(curl -s https://github.com | jq -r '.[0].name')
          fi
          
          echo "Latest tag found: $LATEST_TAG"
          echo "TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Checkout upstream llama.cpp source code
        uses: actions/checkout@v4
        with:
          # Automatically pulls from the official upstream repository using the resolved tag
          repository: 'ggml-org/llama.cpp'
          ref: ${{ steps.fetch_tag.outputs.TAG }}
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake for Intel & Metal
        run: |
          # Enable Metal acceleration and explicitly target x86_64 with AVX2 instruction sets
          cmake -B build \
            -DGGML_METAL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-mavx2" \
            -DCMAKE_CXX_FLAGS="-mavx2"

      - name: Build Binaries
        run: |
          # Compile binaries using parallel processing mapping to available virtual cores
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Test Build Architecture
        run: |
          # Verify the binary is compiled for x86_64 architecture instead of arm64
          file ./build/bin/llama-cli
          ./build/bin/llama-cli --help | head -n 10

      - name: Prepare Artifact Structure
        run: |
          # Gather required binaries into a centralized folder before archiving
          mkdir -p dist
          cp build/bin/llama-cli dist/
          cp build/bin/llama-server dist/
          cp build/bin/llama-quantize dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Automatically names the output file according to your template: llama-${{ TAG }}-metal-macos-x64
          name: llama-${{ steps.fetch_tag.outputs.TAG }}-metal-macos-x64
          path: dist/
