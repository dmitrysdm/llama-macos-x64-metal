name: Build llama.cpp for Intel x86_64 + AMD GPU (macOS 15)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-intel-amd:
    runs-on: macos-15-intel

    steps:
      - name: Checkout upstream llama.cpp master branch
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/llama.cpp'
          ref: 'master'
          submodules: recursive

      - name: Get Short Commit SHA for Artifact Naming
        id: get_sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake

      - name: Configure CMake with Custom RPATH
        run: |
          # CMAKE_INSTALL_RPATH="@loader_path" forces binaries to look for .dylib inside their own folder at runtime
          cmake -B build \
            -DGGML_METAL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH="@loader_path" \
            -DCMAKE_C_FLAGS="-mavx2" \
            -DCMAKE_CXX_FLAGS="-mavx2"

      - name: Build Binaries
        run: |
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Test Build Architecture
        run: |
          file ./build/bin/llama-cli
          ./build/bin/llama-cli --help | head -n 10

      - name: Prepare Artifact Structure
        run: |
          # Create deployment folder
          mkdir -p dist
          
          # Copy executables
          cp build/bin/llama-cli dist/
          cp build/bin/llama-server dist/
          cp build/bin/llama-quantize dist/
          
          # Copy all required dynamic libraries into the exact same folder
          cp build/bin/*.dylib dist/ 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ steps.get_sha.outputs.SHA }}-metal-macos-x64
          path: dist/
